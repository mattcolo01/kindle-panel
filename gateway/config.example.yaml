# Copia in config.yaml e adatta.
timezone: "Europe/Rome"
ha_url: "http://homeassistant:8123"      # rete docker o IP LAN

# Recupero opzionale dopo un errore di connessione a HA. Richiede che il
# container usi network_mode: host e cap_add: [NET_RAW] (vedi compose.yaml),
# e funziona solo sulla stessa LAN/VLAN di HA.
# ha_mac: "00:11:22:33:44:55"
# ha_arp_interface: "eth0"                # opzionale se arp-scan rileva quella giusta

# Plancia di HA da mostrare: il suo URL path, cioè la parte dopo l'host
# nell'indirizzo del browser (http://ha:8123/dashboard-kindle -> dashboard-kindle).
# Viene disegnata la prima vista; delle card sono supportate solo heading e
# custom:home-tasks-card (le altre vengono saltate e annotate nel log).
dashboard: "dashboard-kindle"
language: "it"                           # it | en: testi della card Home Tasks

# Pulsanti del Kindle (solo con dashboard): accanto ai primi task aperti
# compare il simbolo di un tasto, che li spunta (accensione + tasto). È
# l'unica scrittura verso HA: senza questa chiave il gateway legge soltanto.
# true = tutti, in quest'ordine; oppure un elenco con i tasti e l'ordine voluti.
# buttons: true
# buttons: [right_next, right_prev, left_next, left_prev, up, down, left, right, select, menu, home, keyboard]

# In alternativa a "dashboard", un elenco fisso di entità (lista consentita):
# il gateway legge SOLO queste. Usa una sola delle due chiavi.
# title: "Casa"
# rows:                                  # ordine = ordine sullo schermo
#   - entity: sensor.temperatura_soggiorno
#     label: "Soggiorno"
#   - entity: sensor.umidita_soggiorno
#     label: "Umidità"
#   - entity: weather.casa               # mostra condition e temperature
#     label: "Meteo"
